[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-functions-agents"
version = "0.7.1"
description = "A markdown-first programming model for building AI agents on Azure Functions with the GitHub Copilot SDK."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "azure-functions>=1.24.0",
    "github-copilot-sdk>=0.2.1",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
    "azurefunctions-extensions-http-fastapi",
    "aiohttp>=3.9.0",
    "azure-identity>=1.15.0",
    # Pinned to commit 3c4669f on simongdavies/hyperlight-sandbox feat/scoped-credentials
    # (rebased onto fix/python-guest-persist-globals so module globals survive
    # across Sandbox.run() calls -- upstream PR open). Three direct refs (one
    # per package) because pip resolves `[wasm]` / `[python_guest]` extras by
    # name against PyPI, and the core package's `optional-dependencies` field
    # carries no git URL. Revert to a single
    # `hyperlight-sandbox[wasm,python_guest]>=X` line once the fork lands
    # upstream and a release is published.
    "hyperlight-sandbox @ git+https://github.com/simongdavies/hyperlight-sandbox.git@3c4669f#subdirectory=src/sdk/python/core",
    "hyperlight-sandbox-backend-wasm @ git+https://github.com/simongdavies/hyperlight-sandbox.git@3c4669f#subdirectory=src/sdk/python/wasm_backend",
    "hyperlight-sandbox-python-guest @ git+https://github.com/simongdavies/hyperlight-sandbox.git@3c4669f#subdirectory=src/sdk/python/wasm_guests/python_guest",
]

[project.optional-dependencies]
connectors = [
    "azure-functions-connectors @ https://github.com/anthonychu/azure-functions-connectors-python/releases/download/v0.1.0b2/azure_functions_connectors-0.1.0b2-py3-none-any.whl",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azure_functions_agents = ["public/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt out of any conftest.py in the project root (there is none) so
# pytest only discovers tests under ``tests/``.
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "infra",
    "samples",
    "src",
]
